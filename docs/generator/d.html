<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suno Prompt Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.tag{cursor:pointer}
</style>
</head>
<body class="bg-slate-900 text-white">
<div class="p-4">
<div class="flex justify-between mb-4">
<h1 class="text-3xl font-bold">Suno Prompt Studio</h1>
<div class="space-x-2">
<button id="themeBtn" class="px-3 py-2 bg-indigo-600 rounded">Theme</button>
<button id="savePreset" class="px-3 py-2 bg-green-600 rounded">Save Preset</button>
<button id="exportJson" class="px-3 py-2 bg-blue-600 rounded">Export JSON</button>
<button id="importJsonBtn" class="px-3 py-2 bg-orange-600 rounded">Import JSON</button>
<input type="file" id="importJson" hidden>
</div>
</div>

<div class="grid md:grid-cols-3 gap-4">
<div class="bg-slate-800 p-4 rounded">
<h2 class="font-bold mb-2">Style Builder</h2>
<div id="genres"></div>
<hr class="my-3">
<div id="eras"></div>
<hr class="my-3">
<div id="voices"></div>
</div>

<div class="bg-slate-800 p-4 rounded">
<h2 class="font-bold mb-2">Lyrics</h2>
<input id="search" class="w-full text-black p-2 mb-2" placeholder="Tag suchen">
<textarea id="lyrics" class="w-full h-96 text-black p-2">[INTRO]
[Male Vocals]
Hello World

[HOOK]
[Raspy Male Vocals]
We are alive!</textarea>
</div>

<div class="bg-slate-800 p-4 rounded">
<h2 class="font-bold mb-2">Preview</h2>
<div id="stylePreview" class="mb-3 text-sm"></div>
<div id="tagPreview" class="flex flex-wrap gap-2 mb-3"></div>
<pre id="livePreview" class="whitespace-pre-wrap text-sm"></pre>
</div>
</div>

<div class="mt-4 flex gap-2">
<button id="undoBtn" class="px-3 py-2 bg-gray-600 rounded">Undo</button>
<button id="redoBtn" class="px-3 py-2 bg-gray-600 rounded">Redo</button>
<button id="copyBtn" class="px-3 py-2 bg-purple-600 rounded">Copy Suno Export</button>
</div>
</div>

<div id="modal" class="hidden fixed inset-0 bg-black/60 items-center justify-center">
<div class="bg-white text-black p-4 rounded w-96">
<h3 id="modalTitle" class="font-bold mb-2"></h3>
<div id="modalContent"></div>
<button onclick="closeModal()" class="mt-3 px-3 py-2 bg-red-500 text-white rounded">Close</button>
</div>
</div>

<script>
const genres=["Reggae","Dubstep","Trap","Rock","Hip Hop","DnB"];
const eras=["70s","80s","90s","2000s","2010s","2020s"];
const voices=["Male Vocals","Female Vocals","Raspy Male Vocals","Angelic Female Vocals"];

const tagLibrary={
INTRO:["Atmospheric Intro","Epic Intro","Spoken Intro"],
HOOK:["Anthemic Hook","Emotional Hook"],
DROP:["Dubstep Drop","Heavy Dubstep Drop","Melodic Dubstep Drop"],
"Male Vocals":["Raspy Male Vocals","Deep Male Vocals","Aggressive Male Vocals"]
};

let history=[];
let redo=[];

function renderChecks(id,list){
 document.getElementById(id).innerHTML=list.map(x=>
 `<label class="block"><input type="checkbox" value="${x}" class="${id}"> ${x}</label>`
 ).join("");
}

renderChecks("genres",genres);
renderChecks("eras",eras);
renderChecks("voices",voices);

const lyrics=document.getElementById("lyrics");

function saveState(){
 history.push(lyrics.value);
 if(history.length>50) history.shift();
 localStorage.setItem("lyrics",lyrics.value);
 update();
}

lyrics.addEventListener("input",saveState);

function update(){
 const txt=lyrics.value;
 document.getElementById("livePreview").textContent=txt;

 const style=[...document.querySelectorAll("input:checked")]
 .map(x=>x.value).join(", ");
 document.getElementById("stylePreview").textContent=style;

 const tags=[...txt.matchAll(/\[(.*?)\]/g)].map(x=>x[1]);
 document.getElementById("tagPreview").innerHTML=tags.map(t=>
 `<span class="tag bg-indigo-600 px-2 py-1 rounded" onclick="editTag('${t}')">${t}</span>`
 ).join(" ");
}

document.addEventListener("change",update);

window.editTag=function(tag){
 const variants=tagLibrary[tag]||["Custom Variant"];
 document.getElementById("modal").classList.remove("hidden");
 document.getElementById("modal").classList.add("flex");
 document.getElementById("modalTitle").textContent=tag;

 document.getElementById("modalContent").innerHTML=variants.map(v=>
 `<button class="block w-full text-left p-2 border mb-1"
 onclick="replaceTag('${tag}','${v}')">${v}</button>`
 ).join("");
}

window.replaceTag=function(oldTag,newTag){
 lyrics.value=lyrics.value.replace("["+oldTag+"]","["+newTag+"]");
 closeModal();
 saveState();
}

window.closeModal=function(){
 document.getElementById("modal").classList.add("hidden");
}

document.getElementById("copyBtn").onclick=()=>{
 navigator.clipboard.writeText(
 document.getElementById("stylePreview").textContent +
 "\n\n" + lyrics.value
 );
 alert("Kopiert");
};

document.getElementById("savePreset").onclick=()=>{
 const presets=JSON.parse(localStorage.getItem("presets")||"[]");
 presets.push({
   name:"Preset "+Date.now(),
   lyrics:lyrics.value
 });
 localStorage.setItem("presets",JSON.stringify(presets));
 alert("Preset gespeichert");
};

document.getElementById("exportJson").onclick=()=>{
 const blob=new Blob([JSON.stringify({
  lyrics:lyrics.value
 },null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="suno-preset.json";
 a.click();
};

document.getElementById("importJsonBtn").onclick=()=>{
 document.getElementById("importJson").click();
};

document.getElementById("importJson").onchange=(e)=>{
 const file=e.target.files[0];
 const r=new FileReader();
 r.onload=()=>{
  const data=JSON.parse(r.result);
  lyrics.value=data.lyrics||"";
  saveState();
 };
 r.readAsText(file);
};

document.getElementById("undoBtn").onclick=()=>{
 if(history.length>1){
  redo.push(history.pop());
  lyrics.value=history[history.length-1];
  update();
 }
};

document.getElementById("redoBtn").onclick=()=>{
 if(redo.length){
  const s=redo.pop();
  history.push(s);
  lyrics.value=s;
  update();
 }
};

document.getElementById("search").oninput=(e)=>{
 const q=e.target.value.toLowerCase();
 document.querySelectorAll(".tag").forEach(t=>{
   t.style.display=t.textContent.toLowerCase().includes(q)?"":"none";
 });
};

document.getElementById("themeBtn").onclick=()=>{
 document.body.classList.toggle("bg-white");
 document.body.classList.toggle("text-black");
};

lyrics.value=localStorage.getItem("lyrics")||lyrics.value;
history=[lyrics.value];
update();
</script>
</body>
</html>
